name: Validate corpus contributions

on:
  pull_request:
    paths:
      - 'contributions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No `cache: pip` — setup-python's pip cache requires a manifest
          # (requirements.txt / pyproject.toml) at repo root. Without one
          # the action fails the whole job before any validator runs, which
          # is what burned PR #3 (both gates reported "(no output)").
      # --ignore-scripts: a fork PR can edit package.json/package-lock.json,
      # so never run dependency lifecycle scripts during the validation install.
      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Ensure wordlist (Gate 3)
        run: |
          if [ ! -f scripts/.words.txt ]; then
            curl -sL -o scripts/.words.txt \
              https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english.txt
          fi

      - name: Gate 1-3 + 5 — Schema · Safety · Lexical (Node validator)
        id: lexical
        run: |
          set +e
          node scripts/validate-contribution.mjs | tee /tmp/lexical.log
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Install Python deps for Gate 4 (FAISS semantic)
        run: |
          pip install --quiet faiss-cpu sentence-transformers
          # torchcodec has a broken Windows DLL dep on linux too sometimes;
          # we never call it for text embedding so it's safe to drop.
          pip uninstall -y --quiet torchcodec || true

      - name: Gate 4 — Semantic authenticity (FAISS-based)
        id: semantic
        run: |
          set +e
          VERDICT_OUT=/tmp/semantic-verdict.json \
            python scripts/validate-contribution-semantic.py | tee /tmp/semantic.log
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Post combined report on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(no output)'; } };
            const lex = read('/tmp/lexical.log');
            const sem = read('/tmp/semantic.log');
            const body = [
              '## Corpus contribution validator — per JUDGE-STANDARD.md',
              '',
              '### Gates 1-3 · Schema · Safety · Lexical quality',
              '```', lex.slice(-3000), '```',
              '',
              '### Gate 4 · Semantic authenticity (FAISS-based)',
              '```', sem.slice(-3500), '```',
              '',
              'See [JUDGE-STANDARD.md](../blob/main/JUDGE-STANDARD.md) for what each verdict means.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Combined verdict
        run: |
          LEX=${{ steps.lexical.outputs.exit }}
          SEM=${{ steps.semantic.outputs.exit }}
          if [ "$LEX" != "0" ] || [ "$SEM" != "0" ]; then
            echo "::error::Submission rejected by JUDGE-STANDARD.md (lex=$LEX sem=$SEM)"
            exit 1
          fi
