name: Corpus snapshot backup

# Snapshots the canonical corpus state (text files, embeddings,
# extracts, patterns, search index, similarity, visuals, work queue)
# into a GitHub Release with a timestamped tag. Runs every 6 hours.
# Releases older than 7 days are pruned to keep the page clean.
#
# Why: git history already captures every commit, but the on-disk
# binary artifacts (embeddings.bin, search-index.json) drift between
# manual rebuilds. A 6-hour snapshot guarantees a recoverable point
# even if something gets accidentally overwritten by a future build.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, on the hour
  workflow_dispatch:        # also runnable manually from the Actions UI

permissions:
  contents: write   # for creating releases + tags

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute snapshot tag
        id: tag
        run: |
          TS=$(date -u +"%Y%m%dT%H%M%SZ")
          echo "tag=corpus-snapshot-$TS" >> $GITHUB_OUTPUT
          echo "ts=$TS" >> $GITHUB_OUTPUT

      - name: Bundle corpus artifacts
        run: |
          set -euo pipefail
          mkdir -p _snapshot
          # Each artifact, if present. Don't fail if any are missing.
          for f in \
            data-raw/corpus.sqlite \
            data-raw/.contributions-manifest.json \
            public/corpus-stats.json \
            public/text/manifest.json \
            public/embeddings.bin \
            public/embeddings-meta.json \
            public/embeddings-info.json \
            public/embeddings-input-hash.txt \
            public/dossier-extracts.json \
            public/patterns.json \
            public/search-index.json \
            public/event-similarity.json \
            public/visuals.json \
            public/work-available.json \
            public/live-feed.json
          do
            if [ -f "$f" ]; then cp "$f" "_snapshot/$(basename $f)"; fi
          done
          # Per-event text files in one tarball
          if [ -d public/text ]; then
            tar -czf "_snapshot/text-files.tar.gz" -C public/text .
          fi
          ls -la _snapshot/
          du -sh _snapshot/

      - name: Compute size summary
        id: sizes
        run: |
          SUMMARY=$(cd _snapshot && ls -1 | while read f; do
            SZ=$(du -h "$f" | cut -f1)
            echo "- \`$f\` ($SZ)"
          done)
          {
            echo 'body<<EOF'
            echo "Automatic 6-hour snapshot of the canonical corpus state."
            echo ""
            echo "**Files**"
            echo "$SUMMARY"
            echo ""
            echo "To restore a single file: download from this release and drop into the corresponding \`public/\` path."
            echo "To restore the full \`public/text/*.txt\` set: \`tar -xzf text-files.tar.gz -C public/text/\`."
            echo ""
            echo "_Generated by .github/workflows/backup.yml — runs every 6 hours, retains 7 days._"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Corpus snapshot ${{ steps.tag.outputs.ts }}"
          body: ${{ steps.sizes.outputs.body }}
          files: _snapshot/*
          prerelease: true   # don't surface in the "Latest release" pin

      - name: Prune snapshots older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "7 days ago" +"%Y%m%dT%H%M%SZ")
          gh release list --limit 200 \
            | awk -F'\t' '/^corpus-snapshot-/ { print $1 }' \
            | while read tag; do
              # tag format: corpus-snapshot-YYYYMMDDTHHMMSSZ
              STAMP=${tag#corpus-snapshot-}
              if [ "$STAMP" "<" "$CUTOFF" ]; then
                echo "Pruning $tag (older than $CUTOFF)"
                gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done
